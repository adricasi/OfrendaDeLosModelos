name: ci-node

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install (from committed package-lock.json)
        run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test -- --coverage
      - name: Install Chromium for e2e
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (fake model worker)
        run: npm run test:e2e
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Licence check (NFR-008)
        run: npm run licences
